<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>JIN OTA PORTFOLIO</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Noto+Sans+JP:wght@300;400;500;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <header class="site-header">
    <div class="brand">
      <span>JIN</span>
      <span>OTA</span>
      <span>PORTFOLIO</span>
    </div>

    <nav class="global-nav">
      <a href="index.html" class="is-current">Top</a>
      <a href="works.html">Works</a>

      <a href="#" aria-label="X" class="icon-link">𝕏</a>
    </nav>
  </header>

  <main class="page-main">
    <section class="section top-section">
      <div class="top-grid">
        <div class="top-left">
          <div class="symbol-card">
            <div class="symbol">
              <div class="circle"></div>
              <div class="shape shape-a"></div>
              <div class="shape shape-b"></div>
              <div class="shape shape-c"></div>
            </div>
          </div>

          <article class="feature-card feature-large">
            <div class="card-title card-title-dark">Web Design</div>
            <div class="mockup-wrap">
              <img src="images/theport.png" alt="Web Design mockup">
            </div>
            <a href="works.html" class="arrow-btn" aria-label="Worksへ">↗</a>
          </article>
        </div>

        <div class="top-right">
          <article class="feature-card">
            <div class="card-title">Graphic Design</div>
            <img src="images/graphic-main.jpg" alt="Graphic Design">
            <a href="works.html" class="arrow-btn" aria-label="Worksへ">↗</a>
          </article>

          <article class="feature-card about-preview">
            <div class="card-title card-title-dark">About</div>
            <img src="images/about-photo.jpg" alt="Jin Ota portrait">
            <div class="preview-text">
              <h3>太田仁<span>Jin Ota</span></h3>
              <p>よく考えて、よく作る。課題や問題に対して自分が出せる最適解を出し続けます。</p>
            </div>
            <a href="about.html" class="arrow-btn" aria-label="Aboutへ">↗</a>
          </article>

          <article class="feature-card">
            <div class="card-title">Illustration</div>
            <img src="images/illustration-main.jpg" alt="Illustration">
            <a href="works.html" class="arrow-btn" aria-label="Worksへ">↗</a>
          </article>

          <article class="feature-card small-card">
            <div class="card-title">Movie</div>
            <img src="images/movie-main.jpg" alt="Movie">
            <a href="works.html" class="arrow-btn" aria-label="Worksへ">↗</a>
          </article>

          <article class="feature-card small-card contact-preview">
            <div class="card-title card-title-dark">Contact</div>
            <div class="contact-mini">お問い合わせはこちら</div>
            <a href="contact.html" class="arrow-btn" aria-label="Contactへ">↗</a>
          </article>
        </div>
      </div>

    </section>
  </main>
  <hr>

  <footer class="site-footer">
    <nav class="footer-nav">
      <a href="index.html" class="footer-card">
        <span>Top</span>

      </a>
      <a href="contact.html" class="footer-card">
        <span>Contact</span>
        <span class="footer-arrow">↗</span>
