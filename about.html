<body>

    <nav class="global-nav" id="global-nav">

  <main class="page-main">
    <section class="section about-section">
      <div class="section-head">
        <h1>About</h1>
      </div>

      <div class="about-grid">
        <div class="about-photo">
          <img src="images/about-photo.jpg" alt="JIN OTA">
        </div>

        <div class="about-info">
          <article class="info-card name-card">
            <p class="label">Name</p>
            <div class="name-box">
              <h2>太田 仁</h2>
              <span>JIN OTA</span>
            </div>
          </article>

          <article class="info-card profile-card">
            <p class="label">Profile</p>
            <div class="profile-text">
              <p>
                1995年生まれ。東京都在住。日本大学芸術学部映画学科卒業。卒業後、株式会社松竹映像センターにて営業として5年勤務。
              </p>
              <p>
                現在はグラフィックやイラスト制作、映像制作を個人事業として行う。制作事例は映画や演劇のポスター作成や、飲食店のメニューデザイン、グッズなど。イラストを用いたデザインが得意です。
              </p>
            </div>
          </article>
        </div>
      </div>
    </section>

    <script>
    const menuToggle = document.querySelector('.menu-toggle');
    const globalNav = document.querySelector('.global-nav');

    menuToggle.addEventListener('click', () => {
      const isOpen = globalNav.classList.toggle('is-open');
      menuToggle.classList.toggle('is-active', isOpen);
      menuToggle.setAttribute('aria-expanded', isOpen);
    });

    globalNav.querySelectorAll('a').forEach((link) => {
      link.addEventListener('click', () => {
        globalNav.classList.remove('is-open');
        menuToggle.classList.remove('is-active');
        menuToggle.setAttribute('aria-expanded', 'false');
      });
    });
  </script>
</body>
